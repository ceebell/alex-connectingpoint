version: "3.9"

# Overlay the existing LINE stack; keep its MongoDB volume, network and host port.
services:
  frontend:
    image: ${REGISTRY:-}${APP_NAME:-alex-line}-frontend:${FRONTEND_TAG}
    networks:
      - line_net
    ports:
      - target: 3000
        published: ${FRONTEND_PORT:-18081}
        protocol: tcp
        mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.id == ${LINE_NODE_ID}
      resources:
        limits:
          memory: 512M
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
