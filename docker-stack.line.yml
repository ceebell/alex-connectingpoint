version: "3.9"

# Backend-only deployment on the node that runs the existing host Caddy service.
# deploy-line.sh validates required values before legacy Swarm interpolation.
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - line_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.id == ${LINE_NODE_ID}
      resources:
        limits:
          memory: 768M
      restart_policy:
        condition: on-failure
        delay: 5s

  backend:
    image: ${REGISTRY:-}${APP_NAME:-alex-line}-backend:${TAG}
    environment:
      PORT: "8080"
      RUST_LOG: ${RUST_LOG:-info}
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-alex_line}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LINE_SHOP_ID: ${LINE_SHOP_ID}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID}
      LINE_DESTINATION_ID: ${LINE_DESTINATION_ID}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      INQUIRY_ADMIN_TOKEN: ${INQUIRY_ADMIN_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_MODEL: ${HERMES_MODEL:-hermes-agent}
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-120}
      ALEX_API_URL: ${ALEX_API_URL:-https://shop.alexrental.app}
      ALEX_USERNAME: ${ALEX_USERNAME:-}
      ALEX_PASSWORD: ${ALEX_PASSWORD:-}
      ALEX_SHOP_INFO_ID: ${ALEX_SHOP_INFO_ID:-}
      ALEX_BRANCH_IDS: ${ALEX_BRANCH_IDS:-}
      ALEX_PRODUCT_URL_PREFIX: ${ALEX_PRODUCT_URL_PREFIX:-}
      ALEX_IMAGE_ORIGINS: ${ALEX_IMAGE_ORIGINS:-}
      ALEX_MCP_TOKEN: ${ALEX_MCP_TOKEN:-}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_LOGIN_REDIRECT_URI: ${LINE_LOGIN_REDIRECT_URI:-}
      ADMIN_LINE_USER_IDS: ${ADMIN_LINE_USER_IDS:-}
      OA_CONNECTOR_ENABLED: ${OA_CONNECTOR_ENABLED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      LINE_BURST_WINDOW_MS: ${LINE_BURST_WINDOW_MS:-3000}
      LINE_MEDIA_MAX_BYTES: ${LINE_MEDIA_MAX_BYTES:-20971520}
      LINE_MEDIA_RETENTION_DAYS: ${LINE_MEDIA_RETENTION_DAYS:-30}
    ports:
      - target: 8080
        published: ${LINE_HTTP_PORT:-18080}
        protocol: tcp
        mode: host
    networks:
      - line_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.id == ${LINE_NODE_ID}
      resources:
        limits:
          memory: 384M
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s

networks:
  line_net:
    driver: overlay

volumes:
  mongo_data:
